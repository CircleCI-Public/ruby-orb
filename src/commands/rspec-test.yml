description: "Test with RSpec using `circleci testsuite`. Requires a suite defined in .circleci/test-suites.yml. Enable parallelism on CircleCI for faster testing."
parameters:
    suite-name:
        description: >
            Name of the suite in .circleci/test-suites.yml to run with `circleci testsuite run`.
            The file can be in the repository root or <app-dir>, and the suite's outputs.junit must be under out-path.
            More information can be found at: https://circleci.com/docs/guides/test/getting-started-with-smarter-testing/
        type: string
    label:
        default: "RSpec Tests"
        description: "Task label"
        type: string
    out-path:
        default: "/tmp/test-results/rspec"
        description: Directory containing the suite's JUnit results. Will automatically be saved to test_results and artifacts on CircleCI.
        type: string
    app-dir:
        description: >
            Path to the directory to run the test suite from. Not needed if tests run from the root.
        default: .
        type: string
    no_output_timeout:
        type: string
        description: >
            Allows you to specify the no_output_timeout for the rspec test. Defaults to 10m.
        default: "10m"
steps:
    - run:
        name: <<parameters.label>>
        environment:
            PARAM_OUT_PATH: <<parameters.out-path>>
            PARAM_SUITE_NAME: <<parameters.suite-name>>
        command: <<include(scripts/rspec-test.sh)>>
        no_output_timeout: <<parameters.no_output_timeout>>
        working_directory: <<parameters.app-dir>>
    - store_test_results:
        path: <<parameters.out-path>>
    - store_artifacts:
        path: <<parameters.out-path>>
        destination: test-results
